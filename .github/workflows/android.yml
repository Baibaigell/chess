name: Android APK

# 推送到 main 或手动触发时，在云端构建 debug APK。
# 产物在运行页面底部的 Artifacts 里下载。
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # 项目用 pnpm（只有 pnpm-lock.yaml），必须先装 pnpm
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK（含 platforms;android-34、build-tools;34.0.0），
      # 不需要 setup-android，也不需要手动 sdkmanager 安装。
      # 用 android-actions/setup-android 反而会在预装 SDK 之上再装一次 cmdline-tools，
      # 偶发冲突导致这一步直接失败。
      - name: 检查 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" || true
          # 万一预装镜像里没有 34，补装一次兜底
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "缺少 android-34，补装"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0"
          else
            echo "android-34 已预装，跳过安装"
          fi

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 前端要先构建：APK 的 assets 来自 dist/
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        run: node scripts/build.mjs

      - name: 同步到 Android assets
        run: node scripts/sync-android.mjs

      # local.properties 在 .gitignore 里，CI 上没有这个文件，必须现写。
      # 不写的话 Gradle 找不到 SDK，报 "SDK location not found"。
      - name: 写 local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 构建 APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 检查产物
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::没有生成 APK"
            exit 1
          fi
          ls -lh "$APK"
          echo "大小: $(du -h "$APK" | cut -f1)"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: 汇总
        if: always()
        run: |
          {
            echo "## 构建结果"
            echo ""
            if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
              SIZE=$(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
              echo "- APK 已生成，大小 **$SIZE**"
              echo "- 在本次运行的 Artifacts 区下载 \`chess-app-debug-apk\`"
            else
              echo "- 构建失败，请查看上面的日志"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
